name: benchmark

on:
  schedule:
    # Daily safety net in case the Cloudflare Worker trigger misses an event.
    - cron: "17 2 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [zen-models-changed]

permissions:
  contents: write

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm install --no-audit --no-fund

      # No --all: only (re)generates when the free-model set actually changed.
      - run: node scripts/benchmark.mjs

      - name: Commit updated SVGs / README / state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ README.md
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: refresh model benchmarks [skip ci]"
          git push
